
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Tic Tac Toe</title>

</head>

<body>
    <div id="status">Player O's turn</div>
    <div id="grid-div"></div>
    <button id="reset-button">Reset Game</button>

</body>
</html>
<script>
    const board = new Int8Array(9);
    
    let currentPlayer = "O";
    let gameOver = false;
    let movesPlayed = 0;

    const gridElement = document.getElementById("grid-div");
    const resetButton = document.getElementById("reset-button");
    const statusElement = document.getElementById("status");

    function resetBoard() {
        board.fill(0);

        const cells = document.querySelectorAll(".cell");

        cells.forEach(cell => {
            cell.textContent = "";
            cell.classList.remove("winning");
        });

        currentPlayer = "O";
        gameOver = false;
        movesPlayed = 0;

        statusElement.textContent = "Player O's turn";
    }

function checkWinner(board, lastMoveIndex, boardSize = 3, winLength = 3) {
    const lastMoveRow = Math.floor(lastMoveIndex / boardSize);
    const lastMoveColumn = lastMoveIndex % boardSize;
    const playerSymbol = board[lastMoveIndex];

    if (playerSymbol === 0) {
        return null;
    }

    const directions = [
        [0, 1],   // Horizontal
        [1, 0],   // Vertical
        [1, 1],   // Main diagonal
        [1, -1]   // Anti-diagonal
    ];

    function scanDirection(rowStep, columnStep) {
        const matchingCells = [];

        let currentRow = lastMoveRow + rowStep;
        let currentColumn = lastMoveColumn + columnStep;

        while (
            currentRow >= 0 &&
            currentRow < boardSize &&
            currentColumn >= 0 &&
            currentColumn < boardSize &&
            board[currentRow * boardSize + currentColumn] === playerSymbol
        ) {
            matchingCells.push(currentRow * boardSize + currentColumn);

            currentRow += rowStep;
            currentColumn += columnStep;
        }

        return matchingCells;
    }

    for (const [rowStep, columnStep] of directions) {
        const forwardCells = scanDirection(rowStep, columnStep);
        const backwardCells = scanDirection(-rowStep, -columnStep);

        const winningLine = [
            ...backwardCells.reverse(),
            lastMoveIndex,
            ...forwardCells
        ];

        if (winningLine.length >= winLength) {
            return winningLine;
        }
    }

    return null;
}

    function setSymbol(element, index) {
        if (gameOver || board[index] !== 0) {
            return;
        }

        const symbol = currentPlayer === "X" ? 1 : -1;

        board[index] = symbol;
        element.textContent = currentPlayer;
        movesPlayed++;

        const winningCells = checkWinner(board, index);

        if (winningCells !== null) {
            gameOver = true;

            statusElement.textContent = `Player ${currentPlayer} wins!`;

            const cells = gridElement.querySelectorAll(".cell");

            winningCells.forEach(i => {
                cells[i].classList.add("winning");
            });

            return;
        }

        if (movesPlayed === 9) {
            gameOver = true;
            statusElement.textContent = "It's a draw!";
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusElement.textContent = `Player ${currentPlayer}'s turn`;
    }

    resetButton.addEventListener("click", resetBoard);

    for (let i = 0; i < 9; i++) {
        const element = document.createElement("div");
        element.classList.add("cell");

        element.addEventListener("click", () => setSymbol(element, i));

        gridElement.appendChild(element);
    }
</script>
